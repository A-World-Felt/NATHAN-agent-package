name: Claude Code Review

on:
  pull_request:
    types: [opened]
    paths:
      - "src/**/*.ts"
      - "package.json"
      - "tsconfig*.json"

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Relis cette PR comme un développeur TypeScript expérimenté qui maintient une
            **librairie publiée** — `@a-world-felt/nathan-agent-core`, la couche agentique LLM
            de NATHAN (IDE accessible à assistance vocale pour personnes non-voyantes).

            **Écris en français.** Concis. Ne signale que de vrais problèmes, jamais des
            préférences de style. Si tu ne trouves rien, dis-le — n'invente pas.

            La branche est déjà présente dans le répertoire courant. Lis `.claude/CLAUDE.md`
            et `docs/decisions/` avant de juger un choix d'architecture : la plupart sont
            déjà tranchés et justifiés.

            ## Invariants du package — leur violation est un vrai problème

            **Frontières des points d'entrée** (`ADR-AGENT-0002`)
            - le baril `.` ne doit JAMAIS importer `fs`, `path` ou quoi que ce soit de disque —
              il doit rester importable partout
            - rien de `src/testing/` ne doit être atteignable depuis `.` ou `./tools`
            - un nouvel export dans un baril est un changement d'API publique

            **ESM + NodeNext**
            - tout import relatif doit porter l'extension du fichier ÉMIS, donc `.js`
              même depuis un `.ts` : `from "./models/index.js"`. Sans ça, ça compile
              et ça casse à l'exécution.

            **Règle de placement** (`ADR-AGENT-0001`)
            - `models/` : types seulement, aucun import de SDK, aucune dépendance runtime
            - `interfaces/` : ports en `kebab-case.ts`, contrats seulement. **Aucun préfixe `I`** :
              un port est un nom simple (`LLMProvider` dans `llm-provider.ts`, `ContextStrategy`
              dans `context-strategy.ts`). Signaler un `I*` ajouté, pas l'inverse.
            - `services/` : fonctions PURES — ne doit jamais importer `interfaces/`
            - `application/use-cases/` : orchestration uniquement
            - `providers/<vendor>/` : implémentations qui diffèrent par FOURNISSEUR (`llm/providers/ollama/`)
            - `strategies/<nom>/` : implémentations qui diffèrent par ALGORITHME (`context/strategies/sliding-window/`),
              voir `ADR-AGENT-0016`. Le port porte le même mot que le dossier : `LLMProvider`, `ContextStrategy`.
            - `infrastructure/` : les autres adaptateurs concrets à I/O réel

            **Classes vs fonctions** (`ADR-AGENT-0009`)
            - API publique avec état → classe (`AgenticLLM`, `VoiceAgenticLLM`)
            - fonction pure d'orchestration ou de calcul → fonction (`step`, `dispatchTool`)

            **Gestion des erreurs**
            - un outil qui échoue renvoie un `ToolResult` porteur de l'erreur — il ne LÈVE PAS.
              Une exception qui traverse la boucle rend l'agent fragile.
            - les erreurs de provider remontent : `LLMError` avec code.
            - sortie forcée = atterrissage, jamais coupure sèche (`ADR-AGENT-0011`) :
              budget ou répétition → on rappelle le modèle SANS outils pour qu'il rédige.

            **Typage**
            - pas de `any` sans commentaire qui le justifie
            - **si une clé est une chaîne, elle doit être typée.** Une union qui ne vit que
              dans un commentaire dérive en quelques mois — c'est un mode de panne observé
              en production, documenté dans `ADR-AGENT-0005`.

            **Version publiée** (`CONTRIBUTING.md` §5.3)
            - une PR qui touche l'API publique (nouveau port, nouvel export dans un baril,
              nouveau point d'entrée) doit **monter la version** dans `package.json`, et la
              même valeur doit apparaître dans la ligne « Current version » du `README.md`.
              Les deux désaccordés est un vrai problème : c'est ce numéro qui sera publié.
            - la version doit être **strictement supérieure** à celle de `main`. Compare avec
              `git show origin/main:package.json`. Tant qu'on est en `0.x`, un ajout compatible
              est un bump *minor*.
            - une PR purement doc, test ou interne ne bump pas : signaler un bump injustifié
              autant qu'un bump manquant.

            **Sûreté**
            - jamais de clé d'API en dur — variables d'environnement uniquement
            - jamais de `.env` commité
            - une librairie ne lit PAS de fichier de config : l'application charge son `.env`,
              la librairie lit `process.env`

            ## Autres angles

            - rupture de contrat d'un port `I*.ts` déjà publié → casse tous les implémenteurs,
              y compris les repos consommateurs
            - `barrel-contract.test.ts` non mis à jour alors que l'API publique change
            - code mort, références périmées, TODO laissés
            - conformité au critère de fin de la PR (`docs/plans/2026-07-21-v1-decoupage-pr.md`)
            - un test qui affirme sur du texte généré plutôt que sur le comportement
              (`toolCalls`, `stopReason`, état du simulateur) — c'est instable par nature

            ## Ce qui n'est PAS un problème

            - `observe()` et `stream()` présents mais inutilisés : voulu, ils évitent de casser
              une interface publiée en V3/V4
            - absence de couche de permissions : décision assumée (`ADR-AGENT-0004`)
            - absence de table de substitution d'outils : décision assumée (`ADR-AGENT-0010`)
            - `HeuristicTokenCounter` approximatif : décision assumée (`ADR-AGENT-0008`)

            ## Sortie

            Utilise `gh pr comment` pour le retour général.
            Utilise `mcp__github_inline_comment__create_inline_comment` (avec `confirmed: true`)
            pour pointer une ligne précise.
            Ne publie QUE des commentaires GitHub — ne rends pas le texte de revue en message.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
