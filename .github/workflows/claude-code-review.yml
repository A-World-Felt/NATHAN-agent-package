name: Claude Code Review

on:
  pull_request:
    types: [opened]
    paths:
      - "src/**/*.ts"
      - "package.json"
      - "tsconfig*.json"
      # The release pipeline ships artifacts: it is the last thing that should merge unreviewed.
      - ".github/workflows/**"

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this PR as an experienced TypeScript developer maintaining a
            **published library**: `@a-world-felt/nathan-agent-core`, the LLM agentic layer of
            NATHAN (a voice-assisted, accessible IDE for blind users).

            **Write in English.** Be concise. Report real problems only, never style
            preferences. If you find nothing, say so: do not invent findings.

            The branch is already checked out in the working directory. Read `.claude/CLAUDE.md`
            and `docs/decisions/` before judging an architectural choice: most of them are
            already settled and justified there.

            ## Package invariants, where a violation is a real problem

            **Entry point boundaries** (`ADR-AGENT-0002`)
            - the `.` barrel must NEVER import `fs`, `path` or anything touching disk:
              it has to stay importable everywhere
            - nothing under `src/**/testing/` may be reachable from `.` or `./tools`
            - a new export in a barrel is a public API change

            **ESM + NodeNext**
            - every relative import must carry the EMITTED file's extension, so `.js`
              even from a `.ts`: `from "./models/index.js"`. Without it, the code compiles
              and breaks at runtime.

            **Placement rule** (`ADR-AGENT-0001`)
            - `models/`: types only, no SDK import, no runtime dependency
            - `interfaces/`: ports in `kebab-case.ts`, contracts only. **No `I` prefix**:
              a port is a plain noun (`LLMProvider` in `llm-provider.ts`, `ContextStrategy`
              in `context-strategy.ts`). Flag an added `I*`, not the absence of one.
            - `services/`: PURE functions, and they must never import `interfaces/`
            - `application/use-cases/`: orchestration only
            - `providers/<vendor>/`: implementations that differ by SUPPLIER (`llm/providers/ollama/`)
            - `strategies/<name>/`: implementations that differ by ALGORITHM (`context/strategies/sliding-window/`),
              see `ADR-AGENT-0016`. The port carries the same word as the folder: `LLMProvider`, `ContextStrategy`.
            - `infrastructure/`: the remaining concrete adapters with real I/O

            **Classes versus functions** (`ADR-AGENT-0009`)
            - public API with state, use a class (`AgenticLLM`, `VoiceAgenticLLM`)
            - pure orchestration or computation, use a function (`step`, `dispatchTool`)

            **Error handling**
            - a failing tool returns a `ToolResult` carrying the error, it does NOT throw.
              An exception crossing the loop makes the agent fragile.
            - provider errors propagate: `LLMError` with a code.
            - a forced exit is a landing, never a hard cut (`ADR-AGENT-0011`): on budget or
              repetition, call the model back WITHOUT tools so that it writes an answer.

            **Typing**
            - no `any` without a comment justifying it
            - **if a key is a string, it must be typed.** A union that lives only in a comment
              drifts within months: that is a failure mode observed in production, recorded in
              `ADR-AGENT-0005`.

            **Published version** (`CONTRIBUTING.md` section 5.3)
            - a PR touching the public API (new port, new barrel export, new entry point) must
              **raise the version** in `package.json`, and the same value must appear in the
              "Current version" line of `README.md`. The two disagreeing is a real problem:
              that number is what gets published on merge.
            - the version must be **strictly above** the one on `main`. Compare with
              `git show origin/main:package.json`. While in `0.x`, a backwards-compatible
              addition is a *minor* bump.
            - a documentation, test or internals-only PR does not bump: flag an unjustified
              bump as readily as a missing one.

            **Safety**
            - never a hard-coded API key: environment variables only
            - never a committed `.env`
            - a library does NOT read a config file: the application loads its `.env`,
              the library reads `process.env`

            ## Other angles

            - breaking the contract of an already published port breaks every implementer,
              consumer repositories included
            - `barrel-contract.test.ts` left unchanged while the public API changes
            - dead code, stale references, leftover TODOs
            - compliance with the PR completion criterion (`docs/plans/2026-07-21-v1-decoupage-pr.md`)
            - a test asserting on generated text rather than on behaviour (`toolCalls`,
              `stopReason`, simulator state), which is unstable by nature

            ## What is NOT a problem

            - `observe()` and `stream()` present but unused: deliberate, they avoid breaking a
              published interface in V3/V4
            - no permission layer: an accepted decision (`ADR-AGENT-0004`)
            - no tool substitution table: an accepted decision (`ADR-AGENT-0010`)
            - `HeuristicTokenCounter` being approximate: an accepted decision (`ADR-AGENT-0008`)

            ## Output

            Use `gh pr comment` for the general feedback.
            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`)
            to point at a precise line.
            Publish GitHub comments ONLY: do not return the review text as a message.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
