name: Claude PR Description

on:
  pull_request:
    types: [opened]

jobs:
  generate-description:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Detect issue ID from branch name
        id: issue
        run: |
          # convention: type/JIRAID-nom-court (voir CONTRIBUTING.md section 1)
          BRANCH="${{ github.head_ref }}"
          ISSUE_ID=$(echo "$BRANCH" | grep -oP '[A-Z]+-\d+' | head -1 || echo "")
          echo "id=$ISSUE_ID" >> "$GITHUB_OUTPUT"

      - name: Claude Generate PR Title and Description
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Update the title and description of this pull request using `gh pr edit`.

            **Title format:** `{Type} : {Issue-ID} – {Short summary}`
            - Type: Feature | Bugfix | Refactor | Docs | Chore | Hotfix
            - Issue-ID: ${{ steps.issue.outputs.id }}
              If empty, omit the "{Issue-ID} – " part and do not invent one.
            - Short summary: one clear sentence fragment
            - NO EMOJI in the title.

            **Body format:**

            ## Changes
            - Concise bullet list of what changed (max 6 bullets)

            ## How to test
            - 2 to 4 bullets max. Each bullet: where to go + what to do + what to verify.
            - Focus on the key scenarios a reviewer must validate (happy path + one edge case if relevant).
            - Omit this section only for pure config/chore/docs changes with nothing to manually test.

            ## Architecture
            - Include a Mermaid diagram ONLY if the PR introduces or changes a meaningful flow: new service wiring, new API route, new data pipeline, new component interaction.
            - Use `flowchart LR` for data/call flows, `sequenceDiagram` for request/response cycles.
            - Keep diagrams small: max 8 nodes. No diagrams for UI-only or trivial changes.
            - Omit this section entirely if no meaningful flow changed.

            ## Impact
            - Only if there are breaking changes, new deps, or migration steps.
            - Omit this section if no notable impact.

            Analyze the diff with `gh pr diff ${{ github.event.pull_request.number }}`. Write the body to a file
            (e.g. pr-body.md) to avoid shell-escaping a multi-line markdown body, then update the PR with:
            `gh pr edit ${{ github.event.pull_request.number }} --title "..." --body-file pr-body.md`

            Keep it minimal and factual. Only include sections that add value for this specific PR.

          claude_args: |
            --allowedTools "Bash(gh pr edit:*),Bash(gh pr diff:*),Bash(gh pr view:*),Write,Read"
